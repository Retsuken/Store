{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - FashionStore</title>
    <link rel="stylesheet" href="{% static 'users/css/auth.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FashionStore</h1>
                <p class="subtitle">Сброс пароля</p>
            </div>

            {% if token %}
            <form id="resetPasswordForm" class="auth-form">
                {% csrf_token %}
                <input type="hidden" name="token" value="{{ token }}">
                
                <div class="form-group">
                    <label for="new_password">Новый пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="new_password" name="new_password" placeholder="Минимум 8 символов" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('new_password')">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="new_password2">Подтвердите пароль</label>
                    <div class="password-wrapper">
                        <input type="password" id="new_password2" name="new_password2" placeholder="Повторите пароль" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('new_password2')">👁️</button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message" style="display:none;"></div>
                <div id="successMessage" class="success-message" style="display:none;"></div>

                <button type="submit" class="btn-primary" id="resetBtn">
                    <span id="resetText">Сбросить пароль</span>
                    <span id="resetSpinner" class="spinner" style="display:none;"></span>
                </button>
            </form>
            {% else %}
            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="user@example.com" required>
                </div>

                <div id="errorMessage" class="error-message" style="display:none;"></div>
                <div id="successMessage" class="success-message" style="display:none;"></div>

                <button type="submit" class="btn-primary" id="forgotBtn">
                    <span id="forgotText">Отправить ссылку для сброса</span>
                    <span id="forgotSpinner" class="spinner" style="display:none;"></span>
                </button>
            </form>
            {% endif %}

            <div class="auth-footer">
                <p><a href="/login/">Вернуться к входу</a></p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '{{ api_base_url }}';
        const resetToken = '{{ token|default:"" }}';
    </script>
    <script src="{% static 'users/js/auth.js' %}"></script>
</body>
</html>
