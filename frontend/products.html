{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров - FashionStore</title>
    <link rel="stylesheet" href="{% static 'product/css/products.css' %}">
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">FashionStore</a>
                <div class="header-actions">
                    <span class="cart-icon" onclick="showCart()">
                        🛒 <span id="cartCount">0</span>
                    </span>
                    <a href="/profile/" class="profile-link">Профиль</a>
                    <a href="/logout/" class="logout-link">Выйти</a>
                </div>
            </div>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="main">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header">
                <h1>Каталог товаров</h1>
                <div class="filters">
                    <select id="categoryFilter" onchange="applyFilters()">
                        <option value="">Все категории</option>
                    </select>
                    <select id="sortFilter" onchange="applyFilters()">
                        <option value="-created_at">Новинки</option>
                        <option value="price">Цена: по возрастанию</option>
                        <option value="-price">Цена: по убыванию</option>
                        <option value="name">По названию</option>
                        <option value="-name">По названию (Я-А)</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Поиск товаров..." oninput="applyFilters()">
                </div>
            </div>

            <!-- Products Grid -->
            <div id="productsGrid" class="products-grid">
                <div class="loading-spinner"></div>
            </div>

            <!-- Pagination -->
            <div id="pagination" class="pagination"></div>
        </div>
    </main>

    <!-- ==================== CART MODAL ==================== -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>🛒 Корзина</h2>
            <div id="cartItems">
                <p style="text-align:center;color:#666;">Загрузка...</p>
            </div>
            <div class="cart-total">
                <strong>Итого: <span id="cartTotal">0</span> ₽</strong>
            </div>
            <button class="btn-primary" onclick="checkout()">Оформить заказ</button>
            <button class="btn-secondary" onclick="clearCart()">Очистить корзину</button>
        </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script>
        // Передаем URL API в JavaScript
        const API_BASE_URL = '{{ api_base_url|default:"http://localhost:8000" }}';
        console.log('API_BASE_URL:', API_BASE_URL);
    </script>
    
    <!-- Подключаем JavaScript для работы с продуктами -->
    <script src="{% static 'product/js/products.js' %}"></script>
</body>
</html>
